<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Gospel for Kids">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#191a1a">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23191a1a'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='%23d97757'>📖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Daily Gospel for Kids</title>
  <style>
    :root {
      --accent: #d97757;
      --accent-dim: #b8614a;
      --accent-glow: rgba(217, 119, 87, 0.12);
      --bg: #191a1a;
      --bg-card: #1f2121;
      --bg-header: #141515;
      --bg-nav: #1b1c1c;
      --bg-instruction: #232525;
      --text: #e8e4de;
      --text-secondary: #a8a29e;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.14);
      --shadow: rgba(0, 0, 0, 0.25);
    }

    html { font-size: 129%; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    ::selection { background: rgba(217, 119, 87, 0.35); }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Watercolor background */
    .watercolor-layer {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
    }

    .watercolor-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.65;
      will-change: transform;
    }

    .blob-1 {
      width: 55vmax;
      height: 55vmax;
      background: radial-gradient(circle, rgba(219, 160, 190, 0.8) 0%, rgba(219, 160, 190, 0) 70%);
      top: -12%;
      left: -10%;
      animation: drift1 25s ease-in-out infinite alternate;
    }

    .blob-2 {
      width: 50vmax;
      height: 50vmax;
      background: radial-gradient(circle, rgba(160, 180, 220, 0.8) 0%, rgba(160, 180, 220, 0) 70%);
      top: 40%;
      right: -15%;
      animation: drift2 30s ease-in-out infinite alternate;
    }

    .blob-3 {
      width: 48vmax;
      height: 48vmax;
      background: radial-gradient(circle, rgba(180, 210, 200, 0.8) 0%, rgba(180, 210, 200, 0) 70%);
      bottom: -10%;
      left: 20%;
      animation: drift3 28s ease-in-out infinite alternate;
    }

    .blob-4 {
      width: 42vmax;
      height: 42vmax;
      background: radial-gradient(circle, rgba(195, 175, 220, 0.75) 0%, rgba(195, 175, 220, 0) 70%);
      top: 15%;
      left: 50%;
      animation: drift4 32s ease-in-out infinite alternate;
    }

    @keyframes drift1 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(6vw, 8vh) scale(1.08); }
      100% { transform: translate(-4vw, 5vh) scale(0.95); }
    }

    @keyframes drift2 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(-7vw, -5vh) scale(1.05); }
      100% { transform: translate(3vw, -8vh) scale(0.97); }
    }

    @keyframes drift3 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(5vw, -6vh) scale(1.06); }
      100% { transform: translate(-6vw, -3vh) scale(0.94); }
    }

    @keyframes drift4 {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(-5vw, 7vh) scale(1.04); }
      100% { transform: translate(4vw, -4vh) scale(0.98); }
    }

    /* Dark overlay to keep text readable */
    .watercolor-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(25, 26, 26, 0.25);
    }

    /* Title Banner */
    .title-banner {
      text-align: center;
      padding: 2.5rem 1.5rem 1.5rem;
    }

    .title-banner-icon { font-size: 1.8rem; display: block; margin-bottom: 0.6rem; opacity: 0.9; }

    .title-banner-title {
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .title-banner-liturgical {
      font-size: clamp(0.7rem, 2vw, 0.82rem);
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 0.25rem;
      letter-spacing: 0.04em;
    }

    .title-banner-subtitle {
      font-size: clamp(0.6rem, 1.8vw, 0.7rem);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.05em;
    }

    /* Top bar: back link + language toggle */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      position: sticky;
      top: 0.75rem;
      z-index: 99;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.1rem;
      background: rgba(27, 28, 28, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 100px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Language toggle */
    .lang-toggle {
      display: flex;
      background: rgba(27, 28, 28, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 100px;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .lang-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.68rem;
      font-weight: 500;
      padding: 0.5rem 0.85rem;
      cursor: pointer;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
      position: relative;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .lang-btn:not(.active):hover {
      color: var(--accent);
    }

    /* Main */
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 5rem;
    }

    /* Date header */
    .date-header { text-align: center; margin-bottom: 1.5rem; }

    .date-header .day-number {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .date-header .day-details {
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }

    .date-header .season-badge {
      display: inline-block;
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 100px;
      padding: 0.2rem 0.7rem;
      margin-top: 0.6rem;
      opacity: 0.85;
    }

    /* Scripture card */
    .scripture-card {
      background: rgba(31, 33, 33, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s ease;
    }

    .scripture-card:hover { border-color: var(--border-hover); }

    .scripture-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1.1rem 1.5rem 0;
    }

    .scripture-label-icon { font-size: 1.2rem; line-height: 1; }

    .scripture-label-text {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
    }

    .scripture-reference {
      padding: 0.5rem 1.5rem 0;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
    }

    .scripture-body { padding: 1rem 1.5rem 1.5rem; }

    .scripture-text {
      font-size: 1.05rem;
      font-weight: 300;
      line-height: 1.9;
      color: rgba(232, 228, 222, 0.92);
      font-style: italic;
      border-left: 3px solid var(--accent-dim);
      padding-left: 1.15rem;
      margin: 0.75rem 0;
    }

    /* Explanation card */
    .explanation-card {
      background: rgba(31, 33, 33, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s ease;
    }

    .explanation-card:hover { border-color: var(--border-hover); }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 1.1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .card-header-icon { font-size: 1.3rem; line-height: 1; }

    .card-header-title {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
    }

    .card-body { padding: 1.15rem 1.5rem 1.5rem; }

    .card-body p {
      font-size: 0.92rem;
      font-weight: 300;
      line-height: 1.85;
      color: rgba(232, 228, 222, 0.85);
    }

    .questions-list { list-style: none; padding: 0; }

    .questions-list li {
      font-size: 0.92rem;
      font-weight: 300;
      line-height: 1.75;
      color: rgba(232, 228, 222, 0.85);
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 0.8rem;
      align-items: flex-start;
    }

    .questions-list li:last-child { border-bottom: none; padding-bottom: 0; }

    .question-number {
      flex-shrink: 0;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: 50%;
      background: var(--accent-glow);
      border: 1px solid var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 0.15rem;
    }

    .family-prayer {
      background: rgba(35, 37, 37, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-top: 0.5rem;
    }

    .family-prayer p {
      font-size: 0.85rem;
      font-weight: 300;
      line-height: 1.8;
      color: rgba(232, 228, 222, 0.8);
      text-align: center;
    }

    .day-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin: 2rem 0 1rem;
    }

    .day-nav button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 0.45rem 1.1rem;
      border-radius: 100px;
      cursor: pointer;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
      -webkit-tap-highlight-color: transparent;
    }

    .day-nav button:hover { border-color: var(--accent); color: var(--accent); }

    .day-nav .nav-today {
      font-size: 0.62rem;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    footer {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary);
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      border-top: 1px solid var(--border);
      background: rgba(20, 21, 21, 0.6);
    }

    footer a { color: var(--accent); text-decoration: none; transition: opacity 0.2s ease; }
    footer a:hover { opacity: 0.75; }

    .section-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2rem 0 1rem;
      padding: 0 0.25rem;
    }

    .section-divider::before,
    .section-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .section-divider h2 {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      white-space: nowrap;
    }

    .fade-content { transition: opacity 0.25s ease; }
    .fade-content.fading { opacity: 0; }

    @media (max-width: 480px) {
      main { padding: 0.75rem 0.75rem 3rem; }
      .scripture-body { padding: 0.85rem 1.15rem 1.25rem; }
      .scripture-text { font-size: 0.98rem; padding-left: 1rem; }
      .scripture-label { padding: 1rem 1.15rem 0; }
      .scripture-reference { padding: 0.5rem 1.15rem 0; font-size: 0.98rem; }
      .card-header { padding: 1rem 1.15rem; }
      .card-body { padding: 1rem 1.15rem 1.25rem; }
      .date-header .day-number { font-size: 1.8rem; }
      .lang-btn { font-size: 0.65rem; padding: 0.45rem 0.7rem; }
      .back-link { font-size: 0.68rem; padding: 0.45rem 0.85rem; }
    }
  </style>
</head>
<body>

<div class="watercolor-layer">
  <div class="watercolor-blob blob-1"></div>
  <div class="watercolor-blob blob-2"></div>
  <div class="watercolor-blob blob-3"></div>
  <div class="watercolor-blob blob-4"></div>
</div>
<div class="watercolor-overlay"></div>

<main>
  <div class="title-banner">
    <span class="title-banner-icon">📖</span>
    <h1 class="title-banner-title" id="hero-title">Daily Gospel for Kids</h1>
    <p class="title-banner-liturgical" id="liturgical-day-label"></p>
    <p class="title-banner-subtitle" id="hero-subtitle">Let the children come to me — Matthew 19:14</p>
  </div>

  <div class="top-bar">
    <a class="back-link" href="daily-prayers.html" id="back-link">← Back to Prayers</a>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="btn-es" onclick="setLang('es')">ES</button>
    </div>
  </div>

  <div id="gospel-content" class="fade-content">
    <div class="date-header">
      <div class="day-number" id="day-number"></div>
      <div class="day-details" id="day-details"></div>
      <div class="season-badge" id="season-badge"></div>
    </div>

    <div class="scripture-card">
      <div class="scripture-label">
        <span class="scripture-label-icon">✝&#xFE0E;</span>
        <span class="scripture-label-text" id="lbl-gospel">Today's Gospel</span>
      </div>
      <div class="scripture-reference" id="scripture-ref"></div>
      <div class="scripture-body">
        <p class="scripture-text" id="scripture-text"></p>
      </div>
    </div>

    <div class="explanation-card">
      <div class="card-header">
        <span class="card-header-icon">💡</span>
        <span class="card-header-title" id="lbl-meaning">What This Means</span>
      </div>
      <div class="card-body">
        <p id="explanation-text"></p>
      </div>
    </div>

    <div class="explanation-card">
      <div class="card-header">
        <span class="card-header-icon">💬</span>
        <span class="card-header-title" id="lbl-discuss">Let's Talk About It</span>
      </div>
      <div class="card-body">
        <ul class="questions-list" id="questions-list"></ul>
      </div>
    </div>

    <div class="section-divider">
      <h2 id="lbl-prayer-divider">Family Prayer</h2>
    </div>

    <div class="explanation-card">
      <div class="card-header">
        <span class="card-header-icon">🙏</span>
        <span class="card-header-title" id="lbl-pray">Pray Together</span>
      </div>
      <div class="card-body">
        <div class="family-prayer" id="family-prayer"></div>
      </div>
    </div>

    <div class="day-nav">
      <button onclick="changeDay(-1)" id="btn-prev">← Yesterday</button>
      <span class="nav-today" id="nav-today-label">Today</span>
      <button onclick="changeDay(1)" id="btn-next">Tomorrow →</button>
    </div>
  </div>
</main>

<footer>
  <p id="footer-text">✝&#xFE0E; Ad Maiorem Dei Gloriam ✝&#xFE0E;</p>
  <p style="margin-top: 0.5rem;"><a href="daily-prayers.html">Daily Prayers</a></p>
</footer>

<script>
// ═══════════════════════════════════════════════════════════════
// UI LABELS
// ═══════════════════════════════════════════════════════════════
var ui = {
  en: {
    heroTitle: "Daily Gospel for Kids",
    heroSubtitle: "Let the children come to me \u2014 Matthew 19:14",
    heroScroll: "Today\u2019s Reading",

    days: ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
    seasonNames: { advent:'Advent', christmas:'Christmas', lent:'Lent', passion:'Holy Week', easter:'Easter', ordinary:'Ordinary Time' }
  },
  es: {
    heroTitle: "Evangelio Diario para Ni\u00f1os",
    heroSubtitle: "Dejen que los ni\u00f1os vengan a m\u00ed \u2014 Mateo 19:14",
    heroScroll: "Lectura de Hoy",
    backLink: "\u2190 Volver a Oraciones",
    lblGospel: "Evangelio de Hoy",
    lblMeaning: "Qu\u00e9 Significa Esto",
    lblDiscuss: "Hablemos de Esto",
    lblPrayerDivider: "Oraci\u00f3n en Familia",
    lblPray: "Recemos Juntos",
    btnPrev: "\u2190 Ayer",

    seasonNames: { advent:'Adviento', christmas:'Navidad', lent:'Cuaresma', passion:'Semana Santa', easter:'Pascua', ordinary:'Tiempo Ordinario' }
  }
};

// ═══════════════════════════════════════════════════════════════
// ENGLISH PASSAGES
// ═══════════════════════════════════════════════════════════════
var passages_en = [
  {
    ref: "Matthew 19:14",
    text: "Jesus said, \u201CLet the little children come to me, and do not hinder them, for the kingdom of heaven belongs to such as these.\u201D",
    explain: "Some grown-ups tried to keep children away from Jesus, but Jesus said no \u2014 He wanted the kids to come close! Jesus loves children so much. He says that kids have special hearts that are really good at loving God.",
    questions: ["Why do you think Jesus wanted the children to come to Him?", "What would you say to Jesus if you could sit on His lap right now?"],
    prayer: "Dear Jesus, thank You for loving us so much \u2014 especially little kids. Help us to always run to You with happy hearts. Amen."
  },
  {
    ref: "Mark 4:39",
    text: "He got up, rebuked the wind and said to the waves, \u201CQuiet! Be still!\u201D Then the wind died down and it was completely calm.",
    explain: "Jesus and His friends were in a boat when a huge, scary storm came. The waves were crashing and everyone was afraid! But Jesus just stood up and told the storm to stop \u2014 and it did, right away. Jesus is so powerful that even the wind and the waves listen to Him.",
    questions: ["Have you ever been scared during a storm? What did you do?", "How does it make you feel to know Jesus can calm any storm?"],
    prayer: "Dear Jesus, when we feel scared, help us remember that You are bigger and stronger than any storm. Please give us peace in our hearts. Amen."
  },
  {
    ref: "Matthew 14:19\u201320",
    text: "Taking the five loaves and the two fish and looking up to heaven, he gave thanks and broke the loaves. They all ate and were satisfied, and the disciples picked up twelve basketfuls of broken pieces that were left over.",
    explain: "A huge crowd of people were hungry and there was only one little boy\u2019s lunch \u2014 five pieces of bread and two fish. But Jesus said thank you to God, broke the bread, and it kept multiplying! Over 5,000 people ate until they were full, and there were still leftovers. Jesus can do amazing things with even the smallest gifts.",
    questions: ["If you had to share your lunch with everyone, how would you feel?", "What small thing can you share with others today?"],
    prayer: "Dear Jesus, thank You for always giving us what we need. Help us to be generous and share what we have, even when it feels like it\u2019s not much. Amen."
  },
  {
    ref: "Mark 4:30\u201332",
    text: "He said, \u201CWhat shall we say the kingdom of God is like? It is like a mustard seed, which is the smallest of all seeds on earth. Yet when planted, it grows and becomes the largest of all garden plants.\u201D",
    explain: "Jesus told a story about a tiny, tiny seed \u2014 one of the smallest you can imagine. But when you plant it and take care of it, it grows into a huge plant! Jesus is saying that even small acts of love and kindness can grow into something really, really big.",
    questions: ["What\u2019s the smallest good thing you did today? How might it grow?", "Can you think of a time when something small turned into something big?"],

// LITURGICAL SEASON LOGIC
// ═══════════════════════════════════════════════════════════════
function easterDate(year) {
  var a=year%19, b=Math.floor(year/100), c=year%100, d=Math.floor(b/4), e=b%4;
  var f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3);
  var h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4;
  var l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451);
  var month=Math.floor((h+l-7*m+114)/31)-1, day=((h+l-7*m+114)%31)+1;
  return new Date(year, month, day);
}

function toLiturgicalSeason(date) {
  var year=date.getFullYear(), easter=easterDate(year);
  var ashWed=new Date(easter); ashWed.setDate(easter.getDate()-46);
  var palmSun=new Date(easter); palmSun.setDate(easter.getDate()-7);
  var goodFri=new Date(easter); goodFri.setDate(easter.getDate()-2);
  var pentecost=new Date(easter); pentecost.setDate(easter.getDate()+49);
  var christmas=new Date(year,11,25);
  var jan6=new Date(year,0,6), baptism=new Date(jan6);
  if(jan6.getDay()===0){baptism.setDate(7);}else{baptism.setDate(6+(7-jan6.getDay()));}
  var advent=new Date(year,11,25); advent.setDate(25-advent.getDay()-21);
  var d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  if(d>=christmas) return 'christmas';
  if(d>=advent) return 'advent';
  if(d>=pentecost) return 'ordinary';
  if(d>=easter) return 'easter';
  if(d.getTime()===goodFri.getTime()||d.getTime()===palmSun.getTime()) return 'passion';
  if(d>=ashWed) return 'lent';
  if(d<=baptism) return 'christmas';
  return 'ordinary';
}

// ═══════════════════════════════════════════════════════════════
// LANGUAGE & RENDERING
// ═══════════════════════════════════════════════════════════════
var currentLang = localStorage.getItem('gospel-lang') || 'en';
var dayOffset = 0;

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('gospel-lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-es').classList.toggle('active', lang === 'es');
  document.documentElement.lang = lang;
  renderDay();
}

function getDayOfYear(date) {
  var start = new Date(date.getFullYear(), 0, 0);
  return Math.floor((date - start) / 86400000);
}

function applySeasonColors(date) {
  var season = toLiturgicalSeason(date);
  var root = document.documentElement;
  var colors = {
    advent:    { accent:'#9b72b0', dim:'#7d5a91', glow:'rgba(155,114,176,0.12)' },
    christmas: { accent:'#d4af37', dim:'#b8962e', glow:'rgba(212,175,55,0.12)' },
    lent:      { accent:'#9b72b0', dim:'#7d5a91', glow:'rgba(155,114,176,0.12)' },
    passion:   { accent:'#c0392b', dim:'#a33225', glow:'rgba(192,57,43,0.12)' },
    easter:    { accent:'#d4af37', dim:'#b8962e', glow:'rgba(212,175,55,0.12)' },
    ordinary:  { accent:'#5a9e6f', dim:'#4a8a5e', glow:'rgba(90,158,111,0.12)' }
  };
  var c = colors[season] || colors.ordinary;
  root.style.setProperty('--accent', c.accent);
  root.style.setProperty('--accent-dim', c.dim);
  root.style.setProperty('--accent-glow', c.glow);
  var existingStyle = document.getElementById('selection-style');
  if (existingStyle) existingStyle.remove();
  var style = document.createElement('style');
  style.id = 'selection-style';
  style.textContent = '::selection { background: ' + c.accent + '59; }';
  document.head.appendChild(style);
  return season;
}

function renderDay() {
  var L = ui[currentLang];
  var passages = currentLang === 'es' ? passages_es : passages_en;
  var now = new Date();
  now.setDate(now.getDate() + dayOffset);

  var season = applySeasonColors(now);
  var seasonName = L.seasonNames[season] || L.seasonNames.ordinary;

  // UI labels
  document.getElementById('hero-title').textContent = L.heroTitle;
  document.getElementById('hero-subtitle').textContent = L.heroSubtitle;
  document.getElementById('back-link').textContent = L.backLink;
  document.getElementById('lbl-gospel').textContent = L.lblGospel;
  document.getElementById('lbl-meaning').textContent = L.lblMeaning;
  document.getElementById('lbl-discuss').textContent = L.lblDiscuss;
  document.getElementById('lbl-prayer-divider').textContent = L.lblPrayerDivider;
  document.getElementById('lbl-pray').textContent = L.lblPray;
  document.getElementById('btn-prev').textContent = L.btnPrev;
  document.getElementById('btn-next').textContent = L.btnNext;

  // Date header
  document.getElementById('day-number').textContent = now.getDate();
  document.getElementById('day-details').textContent = L.days[now.getDay()] + ', ' + L.months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
  document.getElementById('season-badge').textContent = seasonName;
  document.getElementById('liturgical-day-label').textContent = seasonName;

  // Footer
  document.getElementById('footer-text').textContent = '\u271D\uFE0E ' + seasonName + ' \u00B7 Ad Maiorem Dei Gloriam \u271D\uFE0E';

  // Passage
  var doy = getDayOfYear(now);
  var idx = doy % passages.length;
  var p = passages[idx];

  document.getElementById('scripture-ref').textContent = p.ref;
  document.getElementById('scripture-text').textContent = p.text;
  document.getElementById('explanation-text').textContent = p.explain;

  var qList = document.getElementById('questions-list');
  qList.innerHTML = '';
  p.questions.forEach(function(q, i) {
    var li = document.createElement('li');
    li.innerHTML = '<span class="question-number">' + (i + 1) + '</span><span>' + q + '</span>';
    qList.appendChild(li);
  });

  document.getElementById('family-prayer').innerHTML = '<p>' + p.prayer + '</p>';

  // Nav label
  var label = document.getElementById('nav-today-label');
  if (dayOffset === 0) label.textContent = L.today;
  else if (dayOffset === -1) label.textContent = L.yesterday;
  else if (dayOffset === 1) label.textContent = L.tomorrow;
  else label.textContent = L.months[now.getMonth()] + ' ' + now.getDate();
}

function changeDay(delta) {
  var content = document.getElementById('gospel-content');
  content.classList.add('fading');
  setTimeout(function() {
    dayOffset += delta;
    renderDay();
    content.classList.remove('fading');
  }, 250);
}

// Initialize
(function() {
  document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
  document.getElementById('btn-es').classList.toggle('active', currentLang === 'es');
  document.documentElement.lang = currentLang;
  renderDay();
})();
</script>
