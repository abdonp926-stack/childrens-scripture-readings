<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Gospel for Kids">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#191a1a">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23191a1a'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='%23d97757'>📖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Daily Gospel for Kids</title>
  <style>
    :root {
      --accent: #d97757;
      --accent-dim: #b8614a;
      --accent-glow: rgba(217, 119, 87, 0.12);
      --bg: #191a1a;
      --bg-card: #1f2121;
      --bg-header: #141515;
      --bg-nav: #1b1c1c;
      --bg-instruction: #232525;
      --text: #e8e4de;
      --text-secondary: #a8a29e;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.14);
      --shadow: rgba(0, 0, 0, 0.25);
    }

    html { font-size: 112%; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    ::selection {
      background: rgba(217, 119, 87, 0.35);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Fixed blurred background */
    .page-bg {
      position: fixed;
      inset: 0;
      background: url('hero-bg.jpg') center center / cover no-repeat;
      filter: blur(40px) brightness(0.18) saturate(1.4);
      transform: scale(1.15);
      z-index: -1;
    }

    /* Hero Section */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background: url('hero-bg.jpg') center center / cover no-repeat;
      filter: brightness(0.3);
      z-index: 0;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      padding: 2rem;
      max-width: 600px;
    }

    .hero-icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 1.25rem;
      opacity: 0.9;
    }

    .hero-title {
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.75rem;
    }

    .hero-liturgical {
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 0.5rem;
      letter-spacing: 0.04em;
    }

    .hero-subtitle {
      font-size: clamp(0.72rem, 2vw, 0.82rem);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.06em;
    }

    .hero-scroll {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.2s ease;
    }

    .hero-scroll:hover { color: var(--accent); }

    .hero-scroll-arrow {
      font-size: 1.2rem;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.1rem;
      background: rgba(27, 28, 28, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 100px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: all 0.2s ease;
      position: sticky;
      top: 0.75rem;
      z-index: 99;
      margin-bottom: 0.5rem;
    }

    .back-link:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Main container */
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 5rem;
    }

    /* Date header */
    .date-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .date-header .day-number {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .date-header .day-details {
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }

    .date-header .season-badge {
      display: inline-block;
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 100px;
      padding: 0.2rem 0.7rem;
      margin-top: 0.6rem;
      opacity: 0.85;
    }

    /* Scripture card — the main event */
    .scripture-card {
      background: rgba(31, 33, 33, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s ease;
    }

    .scripture-card:hover {
      border-color: var(--border-hover);
    }

    .scripture-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1.1rem 1.5rem 0;
    }

    .scripture-label-icon {
      font-size: 1.2rem;
      line-height: 1;
    }

    .scripture-label-text {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
    }

    .scripture-reference {
      padding: 0.5rem 1.5rem 0;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
    }

    .scripture-body {
      padding: 1rem 1.5rem 1.5rem;
    }

    .scripture-text {
      font-size: 1.05rem;
      font-weight: 300;
      line-height: 1.9;
      color: rgba(232, 228, 222, 0.92);
      font-style: italic;
      border-left: 3px solid var(--accent-dim);
      padding-left: 1.15rem;
      margin: 0.75rem 0;
    }

    /* Explanation card */
    .explanation-card {
      background: rgba(31, 33, 33, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s ease;
    }

    .explanation-card:hover {
      border-color: var(--border-hover);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 1.1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .card-header-icon {
      font-size: 1.3rem;
      line-height: 1;
    }

    .card-header-title {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
    }

    .card-body {
      padding: 1.15rem 1.5rem 1.5rem;
    }

    .card-body p {
      font-size: 0.92rem;
      font-weight: 300;
      line-height: 1.85;
      color: rgba(232, 228, 222, 0.85);
    }

    /* Discussion questions */
    .questions-list {
      list-style: none;
      padding: 0;
    }

    .questions-list li {
      font-size: 0.92rem;
      font-weight: 300;
      line-height: 1.75;
      color: rgba(232, 228, 222, 0.85);
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 0.8rem;
      align-items: flex-start;
    }

    .questions-list li:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .question-number {
      flex-shrink: 0;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: 50%;
      background: var(--accent-glow);
      border: 1px solid var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 0.15rem;
    }

    /* Family prayer */
    .family-prayer {
      background: rgba(35, 37, 37, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-top: 0.5rem;
    }

    .family-prayer p {
      font-size: 0.85rem;
      font-weight: 300;
      line-height: 1.8;
      color: rgba(232, 228, 222, 0.8);
      text-align: center;
    }

    .family-prayer .amen {
      color: var(--accent);
      font-weight: 500;
      margin-top: 0.5rem;
    }

    /* Navigation dots */
    .day-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin: 2rem 0 1rem;
    }

    .day-nav button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 0.45rem 1.1rem;
      border-radius: 100px;
      cursor: pointer;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
      -webkit-tap-highlight-color: transparent;
    }

    .day-nav button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .day-nav .nav-today {
      font-size: 0.62rem;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary);
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      border-top: 1px solid var(--border);
      background: rgba(20, 21, 21, 0.6);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    footer a:hover {
      opacity: 0.75;
    }

    /* Section divider */
    .section-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2rem 0 1rem;
      padding: 0 0.25rem;
    }

    .section-divider::before,
    .section-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .section-divider h2 {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      white-space: nowrap;
    }

    /* Transition */
    .fade-content {
      transition: opacity 0.25s ease;
    }

    .fade-content.fading {
      opacity: 0;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .hero { min-height: 100vh; }
      main { padding: 0.75rem 0.75rem 3rem; }
      .scripture-body { padding: 0.85rem 1.15rem 1.25rem; }
      .scripture-text { font-size: 0.98rem; padding-left: 1rem; }
      .scripture-label { padding: 1rem 1.15rem 0; }
      .scripture-reference { padding: 0.5rem 1.15rem 0; font-size: 0.98rem; }
      .card-header { padding: 1rem 1.15rem; }
      .card-body { padding: 1rem 1.15rem 1.25rem; }
      .date-header .day-number { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<div class="page-bg"></div>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <span class="hero-icon">📖</span>
    <h1 class="hero-title">Daily Gospel for Kids</h1>
    <p class="hero-liturgical" id="liturgical-day-label"></p>
    <p class="hero-subtitle">Let the children come to me — Matthew 19:14</p>
  </div>
  <a href="#gospel-content" class="hero-scroll">
    <span>Today's Reading</span>
    <span class="hero-scroll-arrow">▾</span>
  </a>
</section>

<main>
  <a class="back-link" href="daily-prayers.html">← Back to Prayers</a>

  <div id="gospel-content" class="fade-content">
    <!-- Date Header -->
    <div class="date-header">
      <div class="day-number" id="day-number"></div>
      <div class="day-details" id="day-details"></div>
      <div class="season-badge" id="season-badge"></div>
    </div>

    <!-- Scripture Card -->
    <div class="scripture-card">
      <div class="scripture-label">
        <span class="scripture-label-icon">✝&#xFE0E;</span>
        <span class="scripture-label-text">Today's Gospel</span>
      </div>
      <div class="scripture-reference" id="scripture-ref"></div>
      <div class="scripture-body">
        <p class="scripture-text" id="scripture-text"></p>
      </div>
    </div>

    <!-- What This Means -->
    <div class="explanation-card">
      <div class="card-header">
        <span class="card-header-icon">💡</span>
        <span class="card-header-title">What This Means</span>
      </div>
      <div class="card-body">
        <p id="explanation-text"></p>
      </div>
    </div>

    <!-- Family Discussion -->
    <div class="explanation-card">
      <div class="card-header">
        <span class="card-header-icon">💬</span>
        <span class="card-header-title">Let's Talk About It</span>
      </div>
      <div class="card-body">
        <ul class="questions-list" id="questions-list"></ul>
      </div>
    </div>

    <!-- Family Prayer -->
    <div class="section-divider">
      <h2>Family Prayer</h2>
    </div>

    <div class="explanation-card">
      <div class="card-header">
        <span class="card-header-icon">🙏</span>
        <span class="card-header-title">Pray Together</span>
      </div>
      <div class="card-body">
        <div class="family-prayer" id="family-prayer"></div>
      </div>
    </div>

    <!-- Day navigation -->
    <div class="day-nav">
      <button onclick="changeDay(-1)">← Yesterday</button>
      <span class="nav-today" id="nav-today-label">Today</span>
      <button onclick="changeDay(1)">Tomorrow →</button>
    </div>
  </div>
</main>

<footer>
  <p id="footer-text">✝&#xFE0E; Ad Maiorem Dei Gloriam ✝&#xFE0E;</p>
  <p style="margin-top: 0.5rem;"><a href="daily-prayers.html">Daily Prayers</a></p>
</footer>

<script>
  // ─── Scripture passages ─────────────────────────────────────────
  // Curated Gospel & scripture passages for young children
  // Each: ref, text, explain, questions[], prayer
  var passages = [
    {
      ref: "Matthew 19:14",
      text: "Jesus said, "Let the little children come to me, and do not hinder them, for the kingdom of heaven belongs to such as these."",
      explain: "Some grown-ups tried to keep children away from Jesus, but Jesus said no — He wanted the kids to come close! Jesus loves children so much. He says that kids have special hearts that are really good at loving God.",
      questions: ["Why do you think Jesus wanted the children to come to Him?", "What would you say to Jesus if you could sit on His lap right now?"],
      prayer: "Dear Jesus, thank You for loving us so much — especially little kids. Help us to always run to You with happy hearts. Amen."
    },
    {
      ref: "Mark 4:39",
      text: "He got up, rebuked the wind and said to the waves, "Quiet! Be still!" Then the wind died down and it was completely calm.",
      explain: "Jesus and His friends were in a boat when a huge, scary storm came. The waves were crashing and everyone was afraid! But Jesus just stood up and told the storm to stop — and it did, right away. Jesus is so powerful that even the wind and the waves listen to Him.",
      questions: ["Have you ever been scared during a storm? What did you do?", "How does it make you feel to know Jesus can calm any storm?"],
      prayer: "Dear Jesus, when we feel scared, help us remember that You are bigger and stronger than any storm. Please give us peace in our hearts. Amen."
    },
    {
      ref: "Matthew 14:19–20",
      text: "Taking the five loaves and the two fish and looking up to heaven, he gave thanks and broke the loaves. They all ate and were satisfied, and the disciples picked up twelve basketfuls of broken pieces that were left over.",
      explain: "A huge crowd of people were hungry and there was only one little boy's lunch — five pieces of bread and two fish. But Jesus said thank you to God, broke the bread, and it kept multiplying! Over 5,000 people ate until they were full, and there were still leftovers. Jesus can do amazing things with even the smallest gifts.",
      questions: ["If you had to share your lunch with everyone, how would you feel?", "What small thing can you share with others today?"],
      prayer: "Dear Jesus, thank You for always giving us what we need. Help us to be generous and share what we have, even when it feels like it's not much. Amen."
    },
    {
      ref: "Mark 4:30–32",
      text: "He said, "What shall we say the kingdom of God is like? It is like a mustard seed, which is the smallest of all seeds on earth. Yet when planted, it grows and becomes the largest of all garden plants."",
      explain: "Jesus told a story about a tiny, tiny seed — one of the smallest you can imagine. But when you plant it and take care of it, it grows into a huge plant! Jesus is saying that even small acts of love and kindness can grow into something really, really big.",
      questions: ["What's the smallest good thing you did today? How might it grow?", "Can you think of a time when something small turned into something big?"],
      prayer: "Dear Jesus, help us do small acts of love every day, knowing that You can make them grow into something beautiful. Amen."
    },
    {
      ref: "John 10:14",
      text: "I am the good shepherd; I know my sheep and my sheep know me.",
      explain: "Jesus says He's like a shepherd — someone who takes care of sheep. A good shepherd knows every single one of his sheep by name. He keeps them safe, feeds them, and never leaves them alone. Jesus knows each of us by name, and He takes care of us just like that!",
      questions: ["What does it feel like to know Jesus knows your name?", "How does Jesus take care of you and our family?"],
      prayer: "Dear Jesus, our Good Shepherd, thank You for knowing us and loving us. Help us to listen to Your voice and follow You always. Amen."
    },
    {
      ref: "Luke 15:4–6",
      text: "Suppose one of you has a hundred sheep and loses one of them. Doesn't he leave the ninety-nine and go after the lost one until he finds it? And when he finds it, he joyfully puts it on his shoulders and goes home.",
      explain: "Jesus told a story about a shepherd who had 100 sheep. When just one got lost, he left all the others to go find it! And when he found that one little sheep, he was so happy he carried it all the way home on his shoulders. That's how much Jesus loves each one of us — He will always come looking for us.",
      questions: ["Have you ever lost something special and then found it? How did you feel?", "How does it feel to know Jesus would come looking for you?"],
      prayer: "Dear Jesus, thank You for never giving up on us. Even when we wander away, You always come to find us and bring us home. Amen."
    },
    {
      ref: "Matthew 7:24–25",
      text: "Everyone who hears these words of mine and puts them into practice is like a wise man who built his house on the rock. The rain came down, the streams rose, and the winds blew and beat against that house; yet it did not fall, because it had its foundation on the rock.",
      explain: "Jesus told a story about two builders. The wise one built his house on solid rock, and when a big storm came, the house stood strong! The foolish one built on sand, and his house fell down — crash! Jesus is saying that when we listen to Him and do what He says, we're like the wise builder. His words make us strong.",
      questions: ["What's stronger: a sandcastle or a rock? Why?", "What's one thing Jesus teaches us that makes our family strong?"],
      prayer: "Dear Jesus, help us build our lives on You, our strong rock. When hard times come, keep our family standing firm together. Amen."
    },
    {
      ref: "John 8:12",
      text: "Jesus spoke to them, saying, "I am the light of the world. Whoever follows me will never walk in darkness, but will have the light of life."",
      explain: "Imagine being in a dark room — you can't see anything and it's a little scary. But then someone turns on a bright light and suddenly you can see everything! Jesus says He is like that light. When we follow Him, we never have to be afraid of the dark because He lights up our path.",
      questions: ["What happens when you turn on a light in a dark room?", "How can Jesus be a light for us when we feel lost or confused?"],
      prayer: "Dear Jesus, You are our light! When things feel dark or scary, help us remember that You are always shining for us. Amen."
    },
    {
      ref: "Matthew 5:14–16",
      text: "You are the light of the world. A town built on a hill cannot be hidden. Neither do people light a lamp and put it under a bowl. Instead they put it on its stand, and it gives light to everyone in the house.",
      explain: "Jesus told His friends that they are lights too! He said it would be silly to turn on a lamp and then cover it with a bowl — you'd lose all the light. Instead, you put it up high so everyone can see. Jesus wants us to be bright lights by being kind, loving, and good so that everyone around us can see God's love.",
      questions: ["What are some ways you can be a light to others today?", "Who in our family is a really good light for others?"],
      prayer: "Dear Jesus, help us shine our lights brightly today. Let people see Your love in everything we do and say. Amen."
    },
    {
      ref: "Matthew 6:26",
      text: "Look at the birds of the air; they do not sow or reap or store away in barns, and yet your heavenly Father feeds them. Are you not much more valuable than they?",
      explain: "Jesus pointed up at the birds flying in the sky and said, "See those birds? They don't have kitchens or grocery stores, but God makes sure they always have food." Then He said, "And you are worth so much more to God than the birds!" God always takes care of us because He loves us.",
      questions: ["Next time you see a bird, what will you remember?", "Can you think of a time when God took care of something our family needed?"],
      prayer: "Dear God, thank You for taking care of the birds, the flowers, and especially us. Help us trust that You will always give us what we need. Amen."
    },
    {
      ref: "Luke 10:30–34",
      text: "A man was going down from Jerusalem to Jericho, when he was attacked by robbers. A Samaritan, as he traveled, came where the man was; and when he saw him, he took pity on him. He bandaged his wounds, put the man on his own donkey, brought him to an inn and took care of him.",
      explain: "Jesus told a story about a man who got hurt on the road. Two important people walked right past him without helping! But then a stranger — someone most people wouldn't expect to help — stopped, bandaged his wounds, and took care of him. Jesus is teaching us that being kind to everyone, even strangers, is really important.",
      questions: ["How would you feel if you were hurt and no one stopped to help?", "Who is someone you can be extra kind to today?"],
      prayer: "Dear Jesus, give us eyes to see people who need help and brave hearts to stop and care for them, just like the Good Samaritan. Amen."
    },
    {
      ref: "John 6:35",
      text: "Then Jesus declared, "I am the bread of life. Whoever comes to me will never go hungry, and whoever believes in me will never be thirsty."",
      explain: "When your tummy rumbles, you need food, right? Jesus says He is like bread for our hearts and our souls. Just like our bodies need food to be strong, our hearts need Jesus to be happy and full. When we pray and spend time with Jesus, He fills us up with love and joy.",
      questions: ["What's your favorite food that fills up your tummy?", "How do you think Jesus fills up our hearts?"],
      prayer: "Dear Jesus, Bread of Life, fill our hearts with Your love today. May we never forget that You are everything we need. Amen."
    },
    {
      ref: "Luke 19:1–6",
      text: "A man was there by the name of Zacchaeus; he was a chief tax collector and was wealthy. He wanted to see who Jesus was, but because he was short he could not see over the crowd. So he ran ahead and climbed a sycamore-fig tree to see him. When Jesus reached the spot, he looked up and said, "Zacchaeus, come down immediately. I must stay at your house today."",
      explain: "Zacchaeus was a little man that nobody liked because he took people's money unfairly. But he really wanted to see Jesus! So he climbed up a big tree. When Jesus walked by, He looked right up at Zacchaeus and said, "Come down! I'm coming to your house today!" Jesus chose to be friends with someone everyone else ignored. After that, Zacchaeus changed and became kind and generous.",
      questions: ["Have you ever felt too small to see something? What did you do?", "Jesus was friends with everyone, even people others didn't like. How can we be like that?"],
      prayer: "Dear Jesus, thank You for seeing us and loving us no matter what. Help us to welcome everyone, just like You welcomed Zacchaeus. Amen."
    },
    {
      ref: "Matthew 18:20",
      text: "For where two or three gather in my name, there am I with them.",
      explain: "Jesus made an amazing promise: whenever even just a few people get together to pray or talk about Him, He is right there with them! So when our family prays together, Jesus is sitting right here with us, listening and loving us. We can't see Him, but He's here.",
      questions: ["Isn't it cool that Jesus is here with us right now? What would you like to tell Him?", "Where else could we invite Jesus to be with us today?"],
      prayer: "Dear Jesus, thank You for being right here with our family. We love You and we're so glad You never leave us. Amen."
    },
    {
      ref: "John 15:12",
      text: "My command is this: Love each other as I have loved you.",
      explain: "Jesus gave us the most important rule of all — love each other! And not just a little bit, but love each other the same big, huge way that He loves us. That means being patient, being kind, forgiving each other, and helping each other every single day.",
      questions: ["How does Jesus love us? Can you think of examples?", "What's one way you can love someone in our family extra well today?"],
      prayer: "Dear Jesus, Your love is so big and so strong. Help us love each other the way You love us — with patience, kindness, and forgiveness. Amen."
    },
    {
      ref: "Mark 10:16",
      text: "And he took the children in his arms, placed his hands on them and blessed them.",
      explain: "When children came to see Jesus, He didn't just wave and say hello. He picked them up, held them in His arms, and blessed them! That means He prayed for good things for each child. Jesus loves to hold children close to His heart.",
      questions: ["How does it feel when someone gives you a big hug?", "What blessing would you ask Jesus to give you today?"],
      prayer: "Dear Jesus, we know You hold us close in Your arms. Bless our family today and fill us with Your love and peace. Amen."
    },
    {
      ref: "Luke 11:9–10",
      text: "So I say to you: Ask and it will be given to you; seek and you will find; knock and the door will be opened to you. For everyone who asks receives; the one who seeks finds; and to the one who knocks, the door will be opened.",
      explain: "Jesus tells us to talk to God! He says it's like knocking on a door — when you knock, the door opens. When we ask God for help, He listens. When we look for Him, we find Him. God always answers when we call on Him.",
      questions: ["What would you like to ask God for today?", "Have you ever prayed for something and then it happened?"],
      prayer: "Dear God, thank You for always listening when we talk to You. Help us remember to ask, to seek, and to knock — because You always answer. Amen."
    },
    {
      ref: "Matthew 5:9",
      text: "Blessed are the peacemakers, for they will be called children of God.",
      explain: "Jesus says that people who make peace are super special — God calls them His own children! Being a peacemaker means helping people get along, not fighting, saying sorry, and being kind when others are upset. When we make peace, we're acting just like God.",
      questions: ["What does it mean to make peace? Can you give an example?", "How can you be a peacemaker at home or with your friends?"],
      prayer: "Dear Jesus, Prince of Peace, help us be peacemakers today. When there's fighting or sadness, help us bring love and kindness. Amen."
    },
    {
      ref: "John 14:27",
      text: "Peace I leave with you; my peace I give you. I do not give to you as the world gives. Do not let your hearts be troubled and do not be afraid.",
      explain: "Before Jesus left His friends, He gave them a very special gift — His peace. Not the kind of peace you get from a toy or a treat, but a deep, strong peace that stays in your heart even when things are hard. Jesus says, "Don't be scared. I'm giving you My peace."",
      questions: ["What makes you feel peaceful and safe?", "When you feel worried, how can you ask Jesus for His peace?"],
      prayer: "Dear Jesus, thank You for Your gift of peace. When our hearts feel troubled or afraid, fill us with the calm that only You can give. Amen."
    },
    {
      ref: "Matthew 17:20",
      text: "Truly I tell you, if you have faith as small as a mustard seed, you can say to this mountain, 'Move from here to there,' and it will move. Nothing will be impossible for you.",
      explain: "A mustard seed is one of the tiniest seeds there is — you could barely see it! But Jesus says that even a little bit of faith that tiny can do amazing things. With God, nothing is impossible! You don't need huge faith — even a small faith, when you trust God with all your heart, can move mountains.",
      questions: ["What is something that seems really hard or impossible right now?", "How can we trust God with it, even if our faith feels small?"],
      prayer: "Dear Jesus, even when our faith feels tiny, we know You can do incredible things. Help us trust You with our whole hearts. Amen."
    },
    {
      ref: "Luke 2:11–12",
      text: "Today in the town of David a Savior has been born to you; he is the Messiah, the Lord. This will be a sign to you: You will find a baby wrapped in cloths and lying in a manger.",
      explain: "On the very first Christmas, angels appeared to shepherds in the fields at night and told them the most exciting news ever: a special baby — Jesus, the Savior — had just been born! And they'd find Him not in a palace, but in a manger, which is where animals eat. God came to us as a tiny baby. Amazing!",
      questions: ["Why do you think God chose to come as a baby instead of a king on a throne?", "What's your favorite part of the Christmas story?"],
      prayer: "Dear Jesus, thank You for coming to earth as a little baby so You could be close to us. Help us always remember the true meaning of Christmas. Amen."
    },
    {
      ref: "John 13:34",
      text: "A new command I give you: Love one another. As I have loved you, so you must love one another.",
      explain: "Jesus gave us a brand-new rule that's also the most important one: love each other! And not just a little — love each other the same way Jesus loves us. That's a really big love: patient, kind, forgiving, and always there. This is how people can tell we belong to Jesus.",
      questions: ["How do people know we love them? What does love look like?", "What's one loving thing you can do for someone today?"],
      prayer: "Dear Jesus, fill our hearts with so much love that it spills out to everyone around us. Help us love like You do. Amen."
    },
    {
      ref: "Mark 2:5",
      text: "When Jesus saw their faith, he said to the paralyzed man, "Son, your sins are forgiven."",
      explain: "A man who couldn't walk had four amazing friends. They wanted to bring him to Jesus so badly that when they couldn't get through the crowd, they climbed up on the roof, made a hole, and lowered their friend down right in front of Jesus! When Jesus saw how much they believed, He healed the man. Good friends help each other get closer to Jesus.",
      questions: ["What would you do to help a friend who needed Jesus?", "Who are the friends that help you be closer to God?"],
      prayer: "Dear Jesus, thank You for our friends. Help us be the kind of friends who carry each other closer to You. Amen."
    },
    {
      ref: "Matthew 28:20",
      text: "And surely I am with you always, to the very end of the age.",
      explain: "These were some of Jesus's very last words to His friends before He went up to heaven. He promised, "I am with you always." Not just sometimes, not just on good days — always! Every single moment, Jesus is right there with us.",
      questions: ["When do you need to remember that Jesus is with you the most?", "Is there a place you go where it's hard to remember Jesus is there?"],
      prayer: "Dear Jesus, thank You for Your promise to be with us always. Help us feel You close, today and every day, no matter where we go. Amen."
    },
    {
      ref: "Luke 6:31",
      text: "Do to others as you would have them do to you.",
      explain: "This is called the Golden Rule, and it's one of the most important things Jesus ever taught. It means: treat people the way you want to be treated! If you want people to be nice to you, be nice to them. If you want people to share with you, share with them. It's that simple!",
      questions: ["How do you want other people to treat you?", "Is there someone you can treat extra nicely today?"],
      prayer: "Dear Jesus, help us treat everyone the way we want to be treated — with kindness, respect, and love. Amen."
    },
    {
      ref: "John 11:35",
      text: "Jesus wept.",
      explain: "This is the shortest verse in the whole Bible, but it teaches us something huge: Jesus cries too. When His friend Lazarus died, Jesus was so sad that He cried. This tells us that it's okay to feel sad and to cry. Jesus understands our feelings because He has feelings just like us.",
      questions: ["How does it feel to know that even Jesus cried when He was sad?", "What do you do when you feel sad? Who do you talk to?"],
      prayer: "Dear Jesus, thank You for understanding how we feel. When we are sad, please be close to us and help us feel Your love. Amen."
    },
    {
      ref: "Luke 15:8–10",
      text: "What woman having ten silver coins, if she loses one coin, does not light a lamp, sweep the house, and search carefully until she finds it? When she has found it, she calls together her friends and neighbors, saying, 'Rejoice with me, for I have found the coin that I had lost.'",
      explain: "Jesus told a story about a woman who had ten special coins and lost one. She searched everywhere — under rugs, behind furniture, in every corner — until she found it! Then she was SO happy she threw a party. Jesus says that's how happy God is when someone who was lost comes back to Him. Every single person matters that much to God.",
      questions: ["Have you ever lost a favorite toy and then found it? How did you feel?", "How does it feel to know God would search everywhere for you?"],
      prayer: "Dear God, thank You for loving each one of us so much that You would search everywhere to find us. We are so precious to You! Amen."
    },
    {
      ref: "Matthew 6:9–13",
      text: "This, then, is how you should pray: 'Our Father in heaven, hallowed be your name, your kingdom come, your will be done, on earth as it is in heaven. Give us today our daily bread. And forgive us our debts, as we also have forgiven our debtors. And lead us not into temptation, but deliver us from the evil one.'",
      explain: "When Jesus's friends asked, "How should we pray?" Jesus taught them this prayer — the Our Father! It's the most special prayer because Jesus Himself gave it to us. It starts by praising God, then asks for what we need, and ends by asking God to keep us safe. It's the perfect prayer.",
      questions: ["What part of the Our Father is your favorite?", "What would you add if you could say one more thing to God?"],
      prayer: "Our Father, who art in heaven, hallowed be Thy name. Thy kingdom come, Thy will be done, on earth as it is in heaven. Give us this day our daily bread, and forgive us our trespasses, as we forgive those who trespass against us. And lead us not into temptation, but deliver us from evil. Amen."
    },
    {
      ref: "Mark 6:50",
      text: "They all saw him and were terrified. But immediately he spoke to them and said, "Take courage! It is I. Don't be afraid."",
      explain: "Jesus's friends were out in their boat at night when they saw someone walking on the water! They were so scared! But it was Jesus, and the first thing He said was, "Don't be afraid! It's me!" Whenever we're scared, Jesus says the same thing to us: "Be brave! I'm right here."",
      questions: ["What are some things that scare you? What do you do when you feel afraid?", "How can you remember that Jesus says "Don't be afraid" when you're scared?"],
      prayer: "Dear Jesus, when we feel scared, help us hear Your voice saying, "Don't be afraid!" Give us courage and help us trust You. Amen."
    },
    {
      ref: "Matthew 18:21–22",
      text: "Then Peter came to Jesus and asked, "Lord, how many times shall I forgive my brother or sister who sins against me? Up to seven times?" Jesus answered, "I tell you, not seven times, but seventy-seven times."",
      explain: "Peter thought he was being really generous by forgiving someone seven whole times. But Jesus said, "No, not just seven — forgive seventy-seven times!" He wasn't really counting. He meant we should always forgive, over and over, without keeping score. That's how God forgives us, and that's how we should forgive each other.",
      questions: ["Is it easy or hard to forgive someone who hurts your feelings?", "How does it feel when someone forgives you?"],
      prayer: "Dear Jesus, help us forgive others the way You forgive us — again and again, without keeping count. Fill our hearts with mercy. Amen."
    },
    {
      ref: "Luke 12:6–7",
      text: "Are not five sparrows sold for two pennies? Yet not one of them is forgotten by God. Indeed, the very hairs of your head are all numbered. Don't be afraid; you are worth more than many sparrows.",
      explain: "Jesus says that God cares about even the tiniest little sparrows — not a single one is forgotten! And then Jesus says, "God even knows how many hairs are on your head." That's how much attention God pays to you. You are so incredibly valuable and precious to Him.",
      questions: ["Can you count the hairs on your head? God can! How does that make you feel?", "If God cares about sparrows, how much more does He care about you?"],
      prayer: "Dear God, thank You for paying attention to every little detail about us. We are never forgotten. Help us remember how precious we are to You. Amen."
    },
    {
      ref: "John 14:2–3",
      text: "My Father's house has many rooms; if that were not so, would I have told you that I am going there to prepare a place for you? And if I go and prepare a place for you, I will come back and take you to be with me.",
      explain: "Jesus told His friends that heaven is like a huge, beautiful house with tons of rooms — and He's getting a special room ready just for each of us! He promised to come back and bring us there so we can be with Him forever. How awesome is that?",
      questions: ["What do you think your room in heaven will be like?", "What are you most excited about when you think about being with Jesus forever?"],
      prayer: "Dear Jesus, thank You for preparing a special place for us in heaven. Help us live today in a way that brings us closer to You. Amen."
    },
    {
      ref: "Matthew 7:7",
      text: "Ask and it will be given to you; seek and you will find; knock and the door will be opened to you.",
      explain: "Jesus is telling us something wonderful: talk to God! Ask Him for things. Look for Him. Knock on His door. He's not hiding — He wants to be found! God loves when we pray and come to Him with everything on our hearts.",
      questions: ["What is something you'd like to ask God for right now?", "Where do you see God in your life?"],
      prayer: "Dear God, thank You for always being ready to listen. Help us come to You with everything — our hopes, our worries, and our joys. Amen."
    },
    {
      ref: "Luke 18:16",
      text: "Jesus called the children to him and said, "Let the little children come to me, and do not hinder them, for the kingdom of God belongs to such as these."",
      explain: "Jesus made a really big deal about children. He said the kingdom of God belongs to people like kids! That's because children trust easily, love openly, and believe with their whole hearts. Jesus wants all of us to have hearts like children.",
      questions: ["What do you think makes kids so special to Jesus?", "How can grown-ups be more like kids in the way they love God?"],
      prayer: "Dear Jesus, thank You for telling us that Your kingdom belongs to kids like us. Help us always keep our childlike trust in You. Amen."
    },
    {
      ref: "Matthew 25:35–36",
      text: "For I was hungry and you gave me something to eat, I was thirsty and you gave me something to drink, I was a stranger and you invited me in, I needed clothes and you clothed me.",
      explain: "Jesus says something amazing: when we help someone who is hungry, thirsty, lonely, or cold — we are actually helping Jesus! Every person we are kind to, it's like being kind to Jesus Himself. So every time we share, help, or welcome someone, we're showing love to God.",
      questions: ["How can we help someone who is hungry or lonely?", "If Jesus was the person you helped today, what would you do for Him?"],
      prayer: "Dear Jesus, open our eyes to see You in everyone we meet. Help us feed the hungry, welcome the lonely, and love everyone as if they were You. Amen."
    },
    {
      ref: "John 15:5",
      text: "I am the vine; you are the branches. If you remain in me and I in you, you will bear much fruit; apart from me you can do nothing.",
      explain: "Jesus used a picture from nature to explain how much we need Him. A branch on a vine gets its food and water from the vine — without it, the branch dries up! Jesus says He is the vine and we are the branches. When we stay close to Him, we grow strong and do beautiful things. Without Him, we can't.",
      questions: ["Have you ever seen a branch that fell off a tree? What happened to it?", "How can we stay connected to Jesus every day?"],
      prayer: "Dear Jesus, You are our vine and we are Your branches. Help us stay close to You so we can grow strong and bear good fruit. Amen."
    },
    {
      ref: "Matthew 5:44",
      text: "But I tell you, love your enemies and pray for those who persecute you.",
      explain: "This is one of the hardest things Jesus ever said: love the people who are mean to you, and pray for them! That sounds really tough, right? But Jesus showed us how — even when people were hurting Him, He prayed for them. When we love even the people who are hard to love, we become more like Jesus.",
      questions: ["Is there someone who's been unkind to you? Can we pray for them together?", "Why do you think Jesus asks us to love even people who are mean?"],
      prayer: "Dear Jesus, loving our enemies is really hard. Please fill our hearts with Your love so we can pray for people who hurt us, just like You did. Amen."
    },
    {
      ref: "Mark 1:17",
      text: "Come, follow me," Jesus said, "and I will send you out to fish for people."",
      explain: "Jesus was walking by the sea when He saw some fishermen. He said, "Follow me, and instead of catching fish, you'll help bring people to God!" And you know what? They dropped their fishing nets right away and followed Him. Jesus is calling each of us too — to follow Him and share His love with others.",
      questions: ["If Jesus walked up to you today and said "Follow me," what would you do?", "How can we "fish for people" by sharing God's love?"],
      prayer: "Dear Jesus, we want to follow You! Help us be brave enough to drop everything and say yes to You every day. Amen."
    },
    {
      ref: "Luke 17:15–16",
      text: "One of them, when he saw he was healed, came back, praising God in a loud voice. He threw himself at Jesus' feet and thanked him.",
      explain: "Jesus healed ten people who were very sick — all ten of them! But only one came back to say thank you. Just one! Jesus was a little sad that the others forgot. This teaches us how important it is to say thank you — to God and to everyone who helps us.",
      questions: ["Do you always remember to say thank you? What are you thankful for today?", "Why do you think saying thank you is so important to Jesus?"],
      prayer: "Dear Jesus, we don't want to be like the nine who forgot. Thank You for everything You give us! Help us have grateful hearts every day. Amen."
    },
    {
      ref: "John 1:5",
      text: "The light shines in the darkness, and the darkness has not overcome it.",
      explain: "Have you ever turned on a flashlight in a dark room? The darkness can't stop the light — the light always wins! That's what Jesus is like. Even when things seem dark and scary in the world, Jesus's light keeps shining and the darkness can never, ever put it out.",
      questions: ["What happens to darkness when you turn on a light?", "How can Jesus's light help us when we feel sad or afraid?"],
      prayer: "Dear Jesus, You are the light that darkness can never overcome. Shine brightly in our hearts and our home. Amen."
    },
    {
      ref: "Matthew 11:28",
      text: "Come to me, all you who are weary and burdened, and I will give you rest.",
      explain: "Sometimes we feel tired — not just in our bodies, but in our hearts too. Maybe we're worried or sad or carrying something heavy inside. Jesus says, "Come to me. Bring all of that to me, and I'll give you rest." He wants to carry our heavy stuff so we can feel light and peaceful.",
      questions: ["What does it feel like when you're really tired and then you get to rest?", "Is there anything heavy on your heart that you want to give to Jesus?"],
      prayer: "Dear Jesus, when we are tired and weary, we come to You. Take our worries and heavy feelings and give us Your peaceful rest. Amen."
    },
    {
      ref: "Luke 8:24–25",
      text: "The disciples went and woke him, saying, "Master, Master, we're going to drown!" He got up and rebuked the wind and the raging waters; the storm subsided, and all was calm. "Where is your faith?" he asked his disciples.",
      explain: "Jesus's friends were in a boat during a terrible storm and Jesus was sleeping! They were so scared they woke Him up crying, "We're going to drown!" Jesus stood up, told the storm to stop — and it did! Then He asked them, "Where is your faith?" He wanted them to trust Him, even in the scariest moments.",
      questions: ["What do you do when you're really scared? Do you remember to ask Jesus for help?", "Why do you think Jesus was able to sleep during the storm?"],
      prayer: "Dear Jesus, even in the biggest storms of our lives, help us trust You. You are always in control and we don't need to be afraid. Amen."
    },
    {
      ref: "Matthew 19:26",
      text: "Jesus looked at them and said, "With man this is impossible, but with God all things are possible."",
      explain: "Some things seem absolutely impossible — too hard, too big, too scary. But Jesus says that with God, nothing is impossible! There is nothing too big for God to handle. He can do anything, and He is on our side.",
      questions: ["What's something that seems impossible to you right now?", "How does it feel to hear that God can do anything?"],
      prayer: "Dear God, when things seem impossible, remind us that nothing is too hard for You. We trust that You can do all things. Amen."
    },
    {
      ref: "Mark 9:36–37",
      text: "He took a little child whom he placed among them. Taking the child in his arms, he said to them, "Whoever welcomes one of these little children in my name welcomes me."",
      explain: "Jesus's friends were arguing about who was the greatest. So Jesus picked up a little child and said, "See this child? When you welcome a child, you welcome Me." Jesus showed that the most important people aren't the biggest or the strongest — sometimes they're the smallest!",
      questions: ["How does it feel to know that welcoming you is like welcoming Jesus?", "How can we welcome other kids and make them feel special?"],
      prayer: "Dear Jesus, thank You for showing us that children are important to You. Help us welcome everyone with open arms, just as we would welcome You. Amen."
    },
    {
      ref: "John 21:6",
      text: "He said, "Throw your net on the right side of the boat and you will find some." When they did, they were unable to haul the net in because of the large number of fish.",
      explain: "Jesus's friends had been fishing all night and caught nothing — zero fish! Then Jesus told them to try the other side of the boat. They listened, and suddenly they caught so many fish the net was about to break! When we listen to Jesus, even when it doesn't make sense, amazing things happen.",
      questions: ["Have you ever tried something a different way and it worked?", "Why is it important to listen to Jesus, even when we don't understand?"],
      prayer: "Dear Jesus, help us listen to You and trust Your directions, even when it doesn't make sense to us. You always know the best way! Amen."
    },
    {
      ref: "Luke 1:37",
      text: "For no word from God will ever fail.",
      explain: "The angel Gabriel said this to Mary when he told her she would be the mother of Jesus. It means that every single thing God promises will come true. God never breaks His promises — not one, not ever. What He says, He does.",
      questions: ["What promises has God made that you know about?", "Can you think of a time when something good happened that God planned?"],
      prayer: "Dear God, we trust that every promise You make will come true. Help us hold onto Your words and believe them with all our hearts. Amen."
    },
    {
      ref: "Matthew 5:7",
      text: "Blessed are the merciful, for they will be shown mercy.",
      explain: "Jesus says that people who show mercy — which means being kind and forgiving even when someone doesn't deserve it — will receive mercy too! When we choose to be gentle and forgiving with others, God is gentle and forgiving with us.",
      questions: ["What does it mean to show mercy to someone?", "When has someone shown you mercy?"],
      prayer: "Dear Jesus, help us be merciful to others, especially when it's hard. Thank You for always being merciful and gentle with us. Amen."
    },
    {
      ref: "John 20:29",
      text: "Then Jesus told him, "Because you have seen me, you have believed; blessed are those who have not seen and yet have believed."",
      explain: "After Jesus rose from the dead, His friend Thomas said he wouldn't believe it until he could see and touch Jesus. When Jesus appeared, Thomas believed! But Jesus said something special: "People who believe in Me without seeing Me are blessed." That's us! We believe in Jesus even though we can't see Him, and that makes our faith extra special.",
      questions: ["We can't see Jesus with our eyes, but how do we know He's real?", "What helps you believe in Jesus even though you can't see Him?"],
      prayer: "Dear Jesus, even though we can't see You, we believe in You with all our hearts. Bless our faith and help it grow stronger every day. Amen."
    },
    {
      ref: "Matthew 13:45–46",
      text: "Again, the kingdom of heaven is like a merchant looking for fine pearls. When he found one of great value, he went away and sold everything he had and bought it.",
      explain: "Jesus told a story about a man who found the most beautiful pearl in the whole world. It was so amazing that he sold everything he had just to get it! Jesus says that's what God's kingdom is like — it's the most valuable, wonderful treasure there is, worth more than anything else.",
      questions: ["What is your most treasured possession?", "Why do you think Jesus is more valuable than anything we can own?"],
      prayer: "Dear Jesus, help us treasure You and Your kingdom above everything else. You are the most precious gift of all. Amen."
    },
    {
      ref: "Luke 23:34",
      text: "Jesus said, "Father, forgive them, for they do not know what they are doing."",
      explain: "Even when Jesus was on the cross, hurting so much, He prayed for the people who hurt Him. He asked God to forgive them! That is the biggest, most amazing love there is. Jesus forgave even when it was the hardest thing to do.",
      questions: ["Why is it sometimes hard to forgive someone?", "How can Jesus's example on the cross help us when we need to forgive?"],
      prayer: "Dear Jesus, Your forgiveness is the most amazing love in the world. Help us forgive others, even when it's hard, because You forgave us first. Amen."
    },
    {
      ref: "Matthew 6:21",

  // ─── Liturgical season logic (matching daily-prayers.html) ──────
  function easterDate(year) {
    var a = year % 19;
    var b = Math.floor(year / 100);
    var c = year % 100;
    var d = Math.floor(b / 4);
    var e = b % 4;
    var f = Math.floor((b + 8) / 25);
    var g = Math.floor((b - f + 1) / 3);
    var h = (19 * a + b - d - g + 15) % 30;
    var i = Math.floor(c / 4);
    var k = c % 4;
    var l = (32 + 2 * e + 2 * i - h - k) % 7;
    var m = Math.floor((a + 11 * h + 22 * l) / 451);
    var month = Math.floor((h + l - 7 * m + 114) / 31) - 1;
    var day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(year, month, day);
  }

  function toLiturgicalSeason(date) {
    var year = date.getFullYear();
    var easter = easterDate(year);
    var ashWednesday = new Date(easter); ashWednesday.setDate(easter.getDate() - 46);
    var palmSunday = new Date(easter); palmSunday.setDate(easter.getDate() - 7);
    var goodFriday = new Date(easter); goodFriday.setDate(easter.getDate() - 2);
    var pentecost = new Date(easter); pentecost.setDate(easter.getDate() + 49);
    var christmas = new Date(year, 11, 25);
    var jan6 = new Date(year, 0, 6);
    var baptism = new Date(jan6);
    if (jan6.getDay() === 0) { baptism.setDate(7); }
    else { baptism.setDate(6 + (7 - jan6.getDay())); }
    var advent = new Date(year, 11, 25);
    var christmasDay = advent.getDay();
    advent.setDate(25 - christmasDay - 21);
    var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    if (d >= christmas) return 'christmas';
    if (d >= advent) return 'advent';
    if (d >= pentecost) return 'ordinary';
    if (d >= easter) return 'easter';
    if (d.getTime() === goodFriday.getTime() || d.getTime() === palmSunday.getTime()) return 'passion';
    if (d >= ashWednesday) return 'lent';
    if (d <= baptism) return 'christmas';
    return 'ordinary';
  }

  // Apply liturgical season colors
  function applySeasonColors(date) {
    var season = toLiturgicalSeason(date);
    var root = document.documentElement;
    var colors = {
      advent:    { accent: '#9b72b0', dim: '#7d5a91', glow: 'rgba(155, 114, 176, 0.12)' },
      christmas: { accent: '#d4af37', dim: '#b8962e', glow: 'rgba(212, 175, 55, 0.12)' },
      lent:      { accent: '#9b72b0', dim: '#7d5a91', glow: 'rgba(155, 114, 176, 0.12)' },
      passion:   { accent: '#c0392b', dim: '#a33225', glow: 'rgba(192, 57, 43, 0.12)' },
      easter:    { accent: '#d4af37', dim: '#b8962e', glow: 'rgba(212, 175, 55, 0.12)' },
      ordinary:  { accent: '#5a9e6f', dim: '#4a8a5e', glow: 'rgba(90, 158, 111, 0.12)' }
    };
    var seasonNames = {
      advent: 'Advent', christmas: 'Christmas', lent: 'Lent',
      passion: 'Holy Week', easter: 'Easter', ordinary: 'Ordinary Time'
    };
    var c = colors[season] || colors.ordinary;
    root.style.setProperty('--accent', c.accent);
    root.style.setProperty('--accent-dim', c.dim);
    root.style.setProperty('--accent-glow', c.glow);
    // Update selection color
    var existingStyle = document.getElementById('selection-style');
    if (existingStyle) existingStyle.remove();
    var style = document.createElement('style');
    style.id = 'selection-style';
    style.textContent = '::selection { background: ' + c.accent + '59; }';
    document.head.appendChild(style);
    // Update footer
    var footer = document.getElementById('footer-text');
    if (footer) {
      footer.textContent = '\u271D\uFE0E ' + seasonNames[season] + ' \u00B7 Ad Maiorem Dei Gloriam \u271D\uFE0E';
    }
    return { season: season, name: seasonNames[season] };
  }

  // ─── Day offset & rendering ─────────────────────────────────────
  var dayOffset = 0;

  function getDayOfYear(date) {
    var start = new Date(date.getFullYear(), 0, 0);
    var diff = date - start;
    return Math.floor(diff / 86400000);
  }

  function renderDay() {
    var now = new Date();
    now.setDate(now.getDate() + dayOffset);

    var seasonInfo = applySeasonColors(now);

    // Date header
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    document.getElementById('day-number').textContent = now.getDate();
    document.getElementById('day-details').textContent = dayNames[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
    document.getElementById('season-badge').textContent = seasonInfo.name;

    // Liturgical hero label
    document.getElementById('liturgical-day-label').textContent = seasonInfo.name;

    // Select passage based on day of year
    var doy = getDayOfYear(now);
    var idx = doy % passages.length;
    var p = passages[idx];

    // Populate
    document.getElementById('scripture-ref').textContent = p.ref;
    document.getElementById('scripture-text').textContent = p.text;
    document.getElementById('explanation-text').textContent = p.explain;

    // Questions
    var qList = document.getElementById('questions-list');
    qList.innerHTML = '';
    p.questions.forEach(function(q, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="question-number">' + (i + 1) + '</span><span>' + q + '</span>';
      qList.appendChild(li);
    });

    // Prayer
    var prayerDiv = document.getElementById('family-prayer');
    prayerDiv.innerHTML = '<p>' + p.prayer + '</p>';

    // Nav label
    var label = document.getElementById('nav-today-label');
    if (dayOffset === 0) { label.textContent = 'Today'; }
    else if (dayOffset === -1) { label.textContent = 'Yesterday'; }
    else if (dayOffset === 1) { label.textContent = 'Tomorrow'; }
    else {
      label.textContent = months[now.getMonth()] + ' ' + now.getDate();
    }
  }

  function changeDay(delta) {
    var content = document.getElementById('gospel-content');
    content.classList.add('fading');
    setTimeout(function() {
      dayOffset += delta;
      renderDay();
      content.classList.remove('fading');
    }, 250);
  }

  // Initial render
  renderDay();

  // Smooth scroll for hero
  document.querySelector('.hero-scroll').addEventListener('click', function(e) {
    e.preventDefault();
    document.getElementById('gospel-content').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
</script>
